name: CI/CD Pipeline - KisanMitra RAG API

on:
  push:
    branches:
      - main
    paths:
      - 'rag-api/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'rag-api/**'
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. CI: Test & Lint
  # ==========================================
  ci-test:
    name: Code Validation & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'rag-api/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rag-api/requirements.txt

      - name: Syntax & Compilation Check
        run: |
          python -m compileall rag-api/app
          python -m compileall rag-api/scripts

  # ==========================================
  # 2. CD: Deploy to AWS EC2
  # ==========================================
  cd-deploy:
    name: Deploy to AWS EC2
    needs: ci-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy on EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          # Ensure SSH directory exists and disable strict host key checks for automated runner
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "🚀 Starting automated deployment on EC2 ($EC2_HOST)..."

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=30 "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e

            echo "📥 Navigating to project directory..."
            cd ~/kisanmitra

            echo "🔄 Pulling latest changes from Git..."
            # Clean untracked changes if any to ensure clean pull
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Activating virtual environment & updating dependencies..."
            cd rag-api
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "🔁 Restarting KisanMitra systemd service..."
            sudo systemctl restart kisanmitra-rag

            echo "⏳ Polling server health check (waiting for Chroma warmup)..."
            for i in {1..15}; do
              if curl -s -f http://localhost:8080/health > /dev/null; then
                echo "🩺 Health check PASSED on attempt $i!"
                break
              fi
              echo "   Waiting for server readiness (attempt $i/15)..."
              sleep 3
            done

            echo "🩺 Final Health Check Verification:"
            curl -s http://localhost:8080/health | python3 -m json.tool || exit 1

            echo "✅ Deployment completed successfully!"
          EOF
